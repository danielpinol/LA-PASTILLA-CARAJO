<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Pastilla Carajo</title>

  <!-- Viewport: bloquea el zoom accidental sin romper el escalado base. -->

  <!-- PWA / "Añadir a pantalla de inicio" en iOS. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pastilla Carajo">
  <meta name="theme-color" content="#fff3d6">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-app-180.png">
  <link rel="icon" type="image/png" href="icon-app-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="error" class="error oculto"></div>

    <button id="btnLevante" class="boton-levante oculto" type="button">YA ME LEVANTÉ</button>

    <div id="resultado" class="oculto">

        <div id="destacadaValor" class="valor">—</div>
      </div>
      <div id="listaTomas" class="lista-tomas"></div>
      <div id="diagnostico" class="diagnostico"></div>

      <!-- TEMPORAL — SOLO PARA QUE DANIEL PRUEBE. Quitar este botón entero
           (este <button> + su manejador en app.js + .boton-reiniciar en
           style.css) antes de que la abuela use la app. Ver CLAUDE.md. -->
      <button id="btnReiniciar" class="boton-reiniciar" type="button">↺ reiniciar (solo pruebas)</button>
    </div>
  </main>

  <script src="app.js"></script>

</html>
