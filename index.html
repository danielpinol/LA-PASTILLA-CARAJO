<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Pastilla</title>

  <!-- Viewport: bloquea el zoom accidental sin romper el escalado base. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <!-- PWA / "Añadir a pantalla de inicio" en iOS. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pastilla">
  <meta name="theme-color" content="#fff3d6">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="error" class="error oculto"></div>

    <button id="btnLevante" class="boton-levante oculto" type="button">YA ME LEVANTÉ</button>

    <div id="resultado" class="oculto">
      <div id="destacada" class="destacada">
        <div id="destacadaEtiqueta" class="etiqueta"></div>
        <div id="destacadaValor" class="valor">—</div>
      </div>
      <div id="listaTomas" class="lista-tomas"></div>
      <div id="diagnostico" class="diagnostico"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
